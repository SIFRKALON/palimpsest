<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palimpsest — A Land Rewritten</title>
<meta name="description" content="An interactive historical atlas of the land called Canaan, Israel, Judaea, Palaestina, Filasṭīn and the Holy Land, across 5,000 years.">
<meta property="og:title" content="Palimpsest — A Land Rewritten">
<meta property="og:description" content="One land, 5,000 years, every name it has carried. An interactive historical atlas.">
<meta property="og:image" content="https://sifrkalon.github.io/palimpsest/assets/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#16110b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Frank+Ruhl+Libre:wght@400;500&family=Amiri:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <svg id="map" role="img" aria-label="Historical map of the land between the Mediterranean and the Jordan"></svg>
    <div id="vignette"></div>
    <div id="lens" hidden><div id="lensRing"></div><button id="lensTab" aria-label="Drag to move the lens; tap to dig deeper"></button></div>

    <header id="head">
      <div id="brand"><span class="kk">Palimpsest</span><span class="sig">a land rewritten</span></div>
      <div id="yearBig" aria-live="polite"></div>
      <div id="eraLine"></div>
      <button id="capChip" class="chip" hidden></button>
    </header>

    <nav id="tools" aria-label="Map tools">
      <button id="bSearch" title="Search places, words and events" aria-label="Search">⌕</button>
      <button id="bJourneys" title="Guided journeys" aria-label="Journeys">✦</button>
      <button id="bLens" title="Scrape: see the older layer underneath" aria-label="Scrape lens">◐</button>
      <button id="bLayers" title="Layers" aria-label="Layers">☰</button>
      <button id="bHome" title="Back to the whole land" aria-label="Reset view">⌂</button>
      <button id="bAbout" title="About, sources and sharing" aria-label="About">?</button>
    </nav>
    <div id="layers" class="pop" hidden></div>
    <div id="bubble" class="bubble" hidden></div>
    <div id="hint">Drag the timeline · tap any spot on the map</div>
  </div>

  <section id="dock">
    <div id="timeline">
      <button id="bPrev" aria-label="Previous era">‹</button>
      <button id="bPlay" aria-label="Play through time">▶</button>
      <div id="track" role="slider" aria-label="Year" tabindex="0"><div id="segs"></div><div id="thumb"><span id="thumbLab"></span></div></div>
      <button id="bNext" aria-label="Next era">›</button>
    </div>
    <div id="sheet">
      <button id="grip" aria-label="Open or close the chapter"><i></i></button>
      <div id="peek"></div>
      <div id="jcard" hidden></div>
      <div id="body"></div>
    </div>
  </section>
</div>

<div id="ov" hidden></div>
<div id="modal" class="modal" hidden role="dialog" aria-modal="true"><button class="x" id="mClose" aria-label="Close">×</button><div id="mBody"></div></div>

<script src="vendor/d3.min.js"></script>
<script src="data/geo.js"></script>
<script src="data/content.js"></script>
<script src="data/atlas.js"></script>
<script src="app.js"></script>
</body>
</html>
